[workspace]
resolver = "2"
members = [
    "crates/fpshud-core",
    "crates/fpshud-analytics",
    "crates/fpshud-telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
libloading = "0.8"
rustix = { version = "1.1", features = ["fs", "mm", "net", "process", "thread", "time"] }
tempfile = "3"

[workspace.lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"
