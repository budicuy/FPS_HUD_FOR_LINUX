[workspace]
resolver = "2"
members = [
    "crates/fpshud-core",
    "crates/fpshud-analytics",
    "crates/fpshud-telemetry",
    "crates/fpshud-screenshot",
    "crates/fpshud-input",
    "crates/fpshud-ipc",
    "crates/fpshud-ui",
    "crates/fpshud-ui-bin",
    "crates/fpshud-layer",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
ash = { version = "0.38", default-features = false }
ash-layer = { version = "0.0.2", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
glow = "0.17"
libc = "0.2"
nvml-wrapper = "0.13"
png = "0.18"
postcard = { version = "1.1", features = ["use-std"] }
rustix = { version = "1.1", features = ["fs", "mm", "net", "param", "process", "thread", "time"] }
serde = { version = "1.0", features = ["derive"] }
swash = "0.2"
tempfile = "3"
wayland-client = { version = "0.31", default-features = false }
wayland-protocols = { version = "0.32", default-features = false, features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["client"] }
x11rb = { version = "0.14", features = ["xinput"] }

[workspace.lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false
