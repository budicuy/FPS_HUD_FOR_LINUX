[workspace]
resolver = "2"
members = [
    "crates/fpshud-core",
    "crates/fpshud-analytics",
    "crates/fpshud-telemetry",
    "crates/fpshud-screenshot",
    "crates/fpshud-input",
    "crates/fpshud-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
libloading = "0.8"
png = "0.18"
rustix = { version = "1.1", features = ["fs", "mm", "net", "process", "thread", "time"] }
tempfile = "3"
x11rb = "0.14"

[workspace.lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"
