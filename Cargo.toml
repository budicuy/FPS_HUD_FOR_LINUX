[workspace]
resolver = "2"
members = [
    "crates/fpshud-core",
    "crates/fpshud-analytics",
    "crates/fpshud-telemetry",
    "crates/fpshud-screenshot",
    "crates/fpshud-input",
    "crates/fpshud-ipc",
    "crates/fpshud-gpui-platform",
    "crates/fpshud-ui",
    "crates/fpshud-ui-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
futures = "0.3"
gpui = { package = "gpui-ce", version = "0.3.0", default-features = false }
gpui_ce_parley = { version = "0.3.0", default-features = false }
gpui_ce_wgpu = "0.3.0"
libc = "0.2"
libloading = "0.8"
png = "0.18"
rustix = { version = "1.1", features = ["fs", "mm", "net", "process", "thread", "time"] }
tempfile = "3"
x11rb = "0.14"

[patch.crates-io]
gpui_ce_wgpu = { path = "crates/vendor/gpui_ce_wgpu" }

[workspace.lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"
