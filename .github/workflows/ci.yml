name: CI Build, Test & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev pci.ids \
            fonts-open-sans ttf-bitstream-vera fonts-dejavu-core python3

      - name: Configure & Build Portable FPSHUD Binary
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          strip -s build/libfpshud.so build/fpshud_test

      - name: Run Multi-Device Simulation & Feature Verification Suite
        run: |
          ./build/fpshud_test 1 || true

      - name: Package Portable Release Archive
        run: |
          mkdir -p release_pkg
          tar -czf release_pkg/fpshud-linux-x86_64.tar.gz -C build libfpshud.so fpshud_test

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: release_pkg/fpshud-linux-x86_64.tar.gz

      - name: Publish Portable Binary to GitHub Releases (on main / tags)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: "FPSHUD Latest Portable Release (Linux x86_64)"
          body: |
            Automated portable binary build of **FPSHUD** (`libfpshud.so` + `fpshud_test`).
            Install with one command:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/budicuy/FPS_HUD_FOR_LINUX/main/install.sh | bash
            ```
          files: release_pkg/fpshud-linux-x86_64.tar.gz
          prerelease: false
