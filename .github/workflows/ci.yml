name: Pure-Rust CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Clippy & Workspace Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2

      - name: Clippy Strict Gate
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Unit & Integration Tests
        run: cargo test --workspace

  package-and-e2e:
    name: Portable Release (GLIBC 2.35) & Headless E2E
    runs-on: ubuntu-22.04
    env:
      FPSHUD_STRICT_GLIBC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Headless Vulkan & Xvfb Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools xvfb binutils file

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ubuntu-22.04-release

      - name: Build Portable Release & Enforce ABI / GLIBC 2.35 Gates
        run: ./scripts/package_release.sh

      - name: Verify Real Vulkan Hook & CPU HUD (Headless Lavapipe 120 frames)
        run: env -u WAYLAND_DISPLAY -u DISPLAY ./scripts/test_vulkan_headless.sh

      - name: Verify Zero-Sudo Install & Uninstall Lifecycle
        env:
          FPSHUD_RELEASE_URL: file://${{ github.workspace }}/dist/fpshud-linux-x86_64.tar.gz
          FPSHUD_RELEASE_SHA_URL: file://${{ github.workspace }}/dist/fpshud-linux-x86_64.tar.gz.sha256
        run: ./scripts/test_e2e_install.sh

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpshud-linux-x86_64
          retention-days: 7
          path: |
            dist/fpshud-linux-x86_64.tar.gz
            dist/fpshud-linux-x86_64.tar.gz.sha256

  distro-compat:
    name: Distro Smoke (${{ matrix.distro.name }})
    needs: package-and-e2e
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: Arch Linux
            image: archlinux:latest
            cmd: "pacman -Syu --noconfirm --needed tar gzip vulkan-icd-loader binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ldd libfpshud.so && ldd fpshud-ui && (! ./fpshud-ui --bad-arg 2>/dev/null)"
          - name: Fedora Latest
            image: fedora:latest
            cmd: "dnf install -y tar gzip vulkan-loader binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ldd libfpshud.so && ldd fpshud-ui"
          - name: Debian 12 (Bookworm)
            image: debian:bookworm-slim
            cmd: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tar gzip libvulkan1 binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ldd libfpshud.so && ldd fpshud-ui"
          - name: Ubuntu 22.04 LTS
            image: ubuntu:22.04
            cmd: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tar gzip libvulkan1 binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ldd libfpshud.so && ldd fpshud-ui"
          - name: Ubuntu 24.04 LTS
            image: ubuntu:24.04
            cmd: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tar gzip libvulkan1 binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ldd libfpshud.so && ldd fpshud-ui"
    steps:
      - name: Download Portable Artifact
        uses: actions/download-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: dist

      - name: Verify Shared Libraries & CLI in Container
        run: |
          docker run --rm -v "${{ github.workspace }}/dist:/work" -w /work "${{ matrix.distro.image }}" \
            bash -euo pipefail -c "${{ matrix.distro.cmd }}"
