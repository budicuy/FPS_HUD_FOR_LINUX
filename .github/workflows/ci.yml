name: Rust CI Build, Test & Release

on:
  push:
    branches: [ "main", "master", "rust-rewrite", "testing" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "rust-rewrite", "testing" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      CARGO_TERM_COLOR: always
      FPSHUD_STRICT_GLIBC: "1"
    steps:
      - name: Install Toolchain & Headless Vulkan Dependencies (Ubuntu 22.04 GLIBC 2.35)
        run: |
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config binutils file \
            mesa-vulkan-drivers vulkan-tools xvfb libx11-xcb1 libxcb1
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Cargo Registry & Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-ubuntu22-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            rust-ubuntu22-${{ runner.arch }}-

      - name: Run Full Workspace Tests & Strict Clippy Gate
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          LVP_ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          VK_DRIVER_FILES="$LVP_ICD" cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Portable Release, Enforce ABI + GLIBC 2.35 Gates & Package
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ./scripts/package_release.sh

      - name: Verify Real Vulkan Hook & Pure-Rust CPU HUD Rendering (Headless Lavapipe 120 frames)
        run: |
          env -u WAYLAND_DISPLAY -u DISPLAY ./scripts/test_vulkan_headless.sh

      - name: Verify Zero-Sudo Install & Uninstall Lifecycle
        run: |
          export FPSHUD_RELEASE_URL="file://${PWD}/dist/fpshud-linux-x86_64.tar.gz"
          export FPSHUD_RELEASE_SHA_URL="file://${PWD}/dist/fpshud-linux-x86_64.tar.gz.sha256"
          ./scripts/test_e2e_install.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: |
            dist/fpshud-linux-x86_64.tar.gz
            dist/fpshud-linux-x86_64.tar.gz.sha256

  distro-compatibility-matrix:
    needs: build-test-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: "Arch Linux (Rolling)"
            image: "archlinux:latest"
            cmd: "pacman -Syu --noconfirm --needed tar gzip vulkan-icd-loader binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ldd libfpshud.so && ldd fpshud-ui && ./fpshud-ui --bad-arg 2>/dev/null; test $? -ne 0"
          - name: "Fedora Latest (RPM)"
            image: "fedora:latest"
            cmd: "dnf install -y tar gzip vulkan-loader binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ldd libfpshud.so && ldd fpshud-ui"
          - name: "Debian 12 (Bookworm)"
            image: "debian:bookworm-slim"
            cmd: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tar gzip libvulkan1 binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ldd libfpshud.so && ldd fpshud-ui"
          - name: "Ubuntu 22.04 LTS (Jammy - GLIBC 2.35 Baseline)"
            image: "ubuntu:22.04"
            cmd: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tar gzip libvulkan1 binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ldd libfpshud.so && ldd fpshud-ui"
          - name: "Ubuntu 24.04 LTS (Noble)"
            image: "ubuntu:24.04"
            cmd: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tar gzip libvulkan1 binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ldd libfpshud.so && ldd fpshud-ui"
    steps:
      - name: Download Portable Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: dist_test

      - name: Flatten Artifact Directory
        run: |
          find dist_test -name "fpshud-linux-x86_64.tar.gz*" -exec cp -v {} dist_test/ \;

      - name: Verify Shared Library Linkage on ${{ matrix.distro.name }}
        run: |
          docker run --rm -v "$PWD/dist_test:/test" -w /test "${{ matrix.distro.image }}" bash -c "${{ matrix.distro.cmd }}"

  publish-release:
    needs: [build-test-release, distro-compatibility-matrix]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped') &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Portable Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: release_pkg

      - name: Flatten Artifact Directory
        run: |
          find release_pkg -name "fpshud-linux-x86_64.tar.gz*" -exec cp -v {} release_pkg/ \;

      - name: Publish Portable Binary to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: "FPSHUD Latest Portable Release (Linux x86_64)"
          files: |
            release_pkg/fpshud-linux-x86_64.tar.gz
            release_pkg/fpshud-linux-x86_64.tar.gz.sha256
          prerelease: false
