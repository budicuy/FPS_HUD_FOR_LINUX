name: CI Build, Test & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ISO C++26 Toolchain (GCC 16) & Build Dependencies
        run: |
          sudo apt-get update
          # <inplace_vector> (P0843) ships in libstdc++ 16+. Ubuntu 26.04 has gcc-16 in universe;
          # older runners (24.04) fall back to the ubuntu-toolchain-r/test PPA.
          if ! apt-cache show g++-16 >/dev/null 2>&1; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
          fi
          sudo apt-get install -y gcc-16 g++-16 build-essential cmake ninja-build pkg-config binutils clang-format \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev pci.ids \
            fonts-open-sans ttf-bitstream-vera fonts-dejavu-core python3 \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libpulse-dev \
            mesa-vulkan-drivers vulkan-tools xvfb

      - name: Configure, Build & Verify ABI/GLIBC Portability Gates
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-16 \
            -DCMAKE_CXX_COMPILER=g++-16
          cmake --build build --target format-check
          cmake --build build --parallel
          if objdump -T build/libfpshud.so build/fpshud_test build/fpshud_recorder build/fpshud_recorder_bin | grep -E "GLIBC_2\.(3[6-9]|4[0-9])"; then
            echo "::error::Binary imports GLIBC >= 2.36 symbols!"
            exit 1
          fi
          EXPORT_COUNT="$(nm -D --defined-only build/libfpshud.so | wc -l)"
          if [ "$EXPORT_COUNT" -ne 8 ]; then
            echo "::error::Expected exactly 8 exported ABI symbols in libfpshud.so, got $EXPORT_COUNT"
            exit 1
          fi
          if LC_ALL=C readelf -d build/libfpshud.so | grep NEEDED | grep -E "lib(GLX|EGL|OpenGL|GL)\.so"; then
            echo "::error::Direct dynamic link to OpenGL/GLX/EGL detected in libfpshud.so DT_NEEDED!"
            exit 1
          fi
          g++-16 -std=c++20 -Wall -Wextra -Werror -fsyntax-only -Isrc -Isrc/recorder -Isrc/core \
            $(pkg-config --cflags libavcodec libavformat libavutil libswscale libswresample libpulse) \
            src/recorder/recorder_main.cpp
          strip --strip-unneeded build/libfpshud.so build/fpshud_test build/fpshud_recorder build/fpshud_recorder_bin

      - name: Run Multi-Device Simulation & Feature Verification Suite
        run: |
          ./build/fpshud_test 1

      - name: Verify Real Vulkan Hook & HUD Rendering (Mesa Lavapipe CPU Software Rasterizer)
        run: |
          ./scripts/test_vulkan_headless.sh

      - name: Verify End-to-End Installation & Uninstallation Lifecycle
        run: |
          ./scripts/test_e2e_install.sh

      - name: Package Portable Release Archive
        run: |
          mkdir -p release_pkg
          chmod 755 build/libfpshud.so build/fpshud_test build/fpshud_recorder build/fpshud_recorder_bin
          tar -czf release_pkg/fpshud-linux-x86_64.tar.gz -C build libfpshud.so fpshud_test fpshud_recorder fpshud_recorder_bin

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: release_pkg/fpshud-linux-x86_64.tar.gz

  distro-compatibility-matrix:
    needs: build-test-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: "Arch Linux (Rolling)"
            image: "archlinux:latest"
            cmd: "pacman -Syu --noconfirm --needed tar gzip procps-ng vulkan-icd-loader && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "Fedora Latest (RPM)"
            image: "fedora:latest"
            cmd: "dnf install -y tar gzip procps-ng vulkan-loader && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "Debian 12 (Bookworm)"
            image: "debian:bookworm-slim"
            cmd: "apt-get update && apt-get install -y --no-install-recommends tar gzip procps libvulkan1 ca-certificates && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "Ubuntu 22.04 LTS (Jammy - GLIBC 2.35 Baseline)"
            image: "ubuntu:22.04"
            cmd: "apt-get update && apt-get install -y --no-install-recommends tar gzip procps libvulkan1 ca-certificates && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "Ubuntu 24.04 LTS (Noble)"
            image: "ubuntu:24.04"
            cmd: "apt-get update && apt-get install -y --no-install-recommends tar gzip procps libvulkan1 ca-certificates && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "openSUSE Tumbleweed"
            image: "opensuse/tumbleweed:latest"
            cmd: "zypper --non-interactive install tar gzip procps libvulkan1 && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
    steps:
      - name: Download Portable Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: dist_test

      - name: Verify Portable Binary Execution on ${{ matrix.distro.name }}
        run: |
          docker run --rm -v "$PWD/dist_test:/test" -w /test "${{ matrix.distro.image }}" bash -c "${{ matrix.distro.cmd }}"

  sanitizer-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain & Dependencies for Sanitizers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang build-essential cmake ninja-build pkg-config \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev pci.ids \
            fonts-open-sans ttf-bitstream-vera fonts-dejavu-core python3 \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libpulse-dev

      - name: Run Memory Safety & Undefined Behavior Suite (ASan + UBSan)
        run: |
          CC=clang CXX=clang++ ./scripts/run_sanitizers.sh
          rm -rf build_asan

  publish-release:
    needs: [build-test-release, distro-compatibility-matrix, sanitizer-verification]
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Portable Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: release_pkg

      - name: Publish Portable Binary to GitHub Releases (on main / tags)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: "FPSHUD Latest Portable Release (Linux x86_64)"
          body: |
            Automated portable ISO C++26 binary build of **FPSHUD** (`libfpshud.so` + `fpshud_test` + `fpshud_recorder`, `GLIBC <= 2.35`, baseline `x86-64` with runtime AVX2 dispatch).

            ✅ **Multi-Distro Compatibility Verified (58/58 Checks Passed):**
            - 🐧 **Arch Linux** (Rolling Release / Steam Deck OS)
            - 🎩 **Fedora Latest** (RPM Ecosystem)
            - 🌀 **Debian 12** (Bookworm)
            - 🟠 **Ubuntu 22.04 LTS** (Jammy - GLIBC 2.35 Floor)
            - 🟣 **Ubuntu 24.04 LTS** (Noble)
            - 🦎 **openSUSE Tumbleweed** (Rolling SUSE)

            🛡️ **Quality, Safety & Rendering Gates Verified:**
            - 🛡️ **Memory Safety & Hardening**: 0 Leaks, 0 Buffer Overflows, 0 UB (AddressSanitizer + UBSan)
            - 🎮 **Real Vulkan Hook & Rendering**: 120-frame swapchain overlay verification via Mesa Lavapipe CPU rasterizer
            - 📦 **Zero-Residue Lifecycle**: Clean sandboxed `install.sh` and `uninstall.sh` lifecycle verification

            Install with one command:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/budicuy/FPS_HUD_FOR_LINUX/main/install.sh | bash
            ```
          files: release_pkg/fpshud-linux-x86_64.tar.gz
          prerelease: false
