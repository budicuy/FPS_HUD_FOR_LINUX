name: CI Build & Auto-Release Portable Binary

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev pci.ids

      - name: Configure & Build Portable FPSHUD
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run Multi-Device Simulation & Feature Verification Suite
        run: |
          ./build/fpshud_test 1 || true

      - name: Package Portable Release Tarball (fpshud-linux-x86_64.tar.gz)
        run: |
          tar -czf fpshud-linux-x86_64.tar.gz -C build libfpshud.so fpshud_test

      - name: Publish Portable Binary to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "FPSHUD Latest Portable Release (Linux x86_64)"
          body: |
            Automated portable Linux `x86_64` release of **FPSHUD** (`libfpshud.so` + `fpshud_test`).
            Install with a single command:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/budicuy/FPS_HUD_FOR_LINUX/main/install.sh | bash
            ```
          files: fpshud-linux-x86_64.tar.gz
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
