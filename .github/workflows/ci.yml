name: CI Build, Test & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain & Build Dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          EXTRA_COMPILER=""
          if apt-cache show g++-16 >/dev/null 2>&1; then
            EXTRA_COMPILER="gcc-16 g++-16"
          elif apt-cache show g++-15 >/dev/null 2>&1; then
            EXTRA_COMPILER="gcc-15 g++-15"
          elif apt-cache show clang-19 >/dev/null 2>&1; then
            EXTRA_COMPILER="clang-19 lld-19"
          else
            EXTRA_COMPILER="clang"
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            $EXTRA_COMPILER build-essential cmake ninja-build pkg-config binutils clang-format \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev pci.ids \
            fonts-open-sans ttf-bitstream-vera fonts-dejavu-core python3 \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libpulse-dev \
            mesa-vulkan-drivers vulkan-tools xvfb

      - name: Configure, Build & Verify ABI/GLIBC Portability Gates
        run: |
          if command -v g++-16 >/dev/null 2>&1; then
            CC_BIN="gcc-16"
            CXX_BIN="g++-16"
          elif command -v g++-15 >/dev/null 2>&1; then
            CC_BIN="gcc-15"
            CXX_BIN="g++-15"
          elif command -v clang++-19 >/dev/null 2>&1; then
            CC_BIN="clang-19"
            CXX_BIN="clang++-19"
          elif command -v clang++ >/dev/null 2>&1; then
            CC_BIN="clang"
            CXX_BIN="clang++"
          else
            CC_BIN="gcc"
            CXX_BIN="g++"
          fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC_BIN" \
            -DCMAKE_CXX_COMPILER="$CXX_BIN"
          cmake --build build --target format-check
          cmake --build build --parallel
          if objdump -T build/libfpshud.so build/fpshud_test build/fpshud_recorder build/fpshud_recorder_bin | grep -E "GLIBC_2\.(3[6-9]|4[0-9])"; then
            echo "::error::Binary imports GLIBC >= 2.36 symbols!"
            exit 1
          fi
          EXPORT_COUNT="$(nm -D --defined-only build/libfpshud.so | wc -l)"
          if [ "$EXPORT_COUNT" -ne 8 ]; then
            echo "::error::Expected exactly 8 exported ABI symbols in libfpshud.so, got $EXPORT_COUNT"
            exit 1
          fi
          if LC_ALL=C readelf -d build/libfpshud.so | grep NEEDED | grep -E "lib(GLX|EGL|OpenGL|GL)\.so"; then
            echo "::error::Direct dynamic link to OpenGL/GLX/EGL detected in libfpshud.so DT_NEEDED!"
            exit 1
          fi
          "$CXX_BIN" -std=c++26 -Wall -Wextra -Werror -Wno-deprecated-declarations -fsyntax-only -Isrc -Isrc/recorder -Isrc/core \
            $(pkg-config --cflags libavcodec libavformat libavutil libswscale libswresample libpulse) \
            src/recorder/recorder_main.cpp
          strip --strip-unneeded build/libfpshud.so build/fpshud_test build/fpshud_recorder build/fpshud_recorder_bin

      - name: Run Multi-Device Simulation & Feature Verification Suite
        run: |
          ./build/fpshud_test 1

      - name: Verify Real Vulkan Hook & HUD Rendering (Mesa Lavapipe CPU Software Rasterizer)
        run: |
          ./scripts/test_vulkan_headless.sh

      - name: Verify End-to-End Installation & Uninstallation Lifecycle
        run: |
          ./scripts/test_e2e_install.sh

      - name: Package Portable Release Archive
        run: |
          mkdir -p release_pkg
          cp scripts/uninstall.sh build/uninstall.sh
          mkdir -p build/src/recorder build/src/core
          cp src/recorder/recorder_main.cpp src/recorder/recorder_ipc.hpp build/src/recorder/
          cp src/core/pack_indexing.hpp build/src/core/
          chmod 755 build/libfpshud.so build/fpshud build/fpshud_test build/fpshud_recorder build/fpshud_recorder_bin build/uninstall.sh
          tar -czf release_pkg/fpshud-linux-x86_64.tar.gz -C build libfpshud.so fpshud fpshud_test fpshud_recorder fpshud_recorder_bin uninstall.sh src
          (cd release_pkg && sha256sum fpshud-linux-x86_64.tar.gz > fpshud-linux-x86_64.tar.gz.sha256)

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: |
            release_pkg/fpshud-linux-x86_64.tar.gz
            release_pkg/fpshud-linux-x86_64.tar.gz.sha256

  distro-compatibility-matrix:
    needs: build-test-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: "Arch Linux (Rolling)"
            image: "archlinux:latest"
            cmd: "pacman -Syu --noconfirm --needed tar gzip procps-ng vulkan-icd-loader && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "Fedora Latest (RPM)"
            image: "fedora:latest"
            cmd: "dnf install -y tar gzip procps-ng vulkan-loader && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "Debian 12 (Bookworm)"
            image: "debian:bookworm-slim"
            cmd: "apt-get update && apt-get install -y --no-install-recommends tar gzip procps libvulkan1 ca-certificates && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "Ubuntu 22.04 LTS (Jammy - GLIBC 2.35 Baseline)"
            image: "ubuntu:22.04"
            cmd: "apt-get update && apt-get install -y --no-install-recommends tar gzip procps libvulkan1 ca-certificates && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "Ubuntu 24.04 LTS (Noble)"
            image: "ubuntu:24.04"
            cmd: "apt-get update && apt-get install -y --no-install-recommends tar gzip procps libvulkan1 ca-certificates && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "openSUSE Tumbleweed"
            image: "opensuse/tumbleweed:latest"
            cmd: "zypper --non-interactive install tar gzip procps libvulkan1 && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
    steps:
      - name: Download Portable Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: dist_test

      - name: Verify Portable Binary Execution on ${{ matrix.distro.name }}
        run: |
          docker run --rm -v "$PWD/dist_test:/test" -w /test "${{ matrix.distro.image }}" bash -c "${{ matrix.distro.cmd }}"

  sanitizer-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain & Dependencies for Sanitizers
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          EXTRA_COMPILER=""
          if apt-cache show g++-16 >/dev/null 2>&1; then
            EXTRA_COMPILER="gcc-16 g++-16"
          elif apt-cache show g++-15 >/dev/null 2>&1; then
            EXTRA_COMPILER="gcc-15 g++-15"
          elif apt-cache show clang-19 >/dev/null 2>&1; then
            EXTRA_COMPILER="clang-19"
          else
            EXTRA_COMPILER="clang"
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            $EXTRA_COMPILER build-essential cmake ninja-build pkg-config \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev pci.ids \
            fonts-open-sans ttf-bitstream-vera fonts-dejavu-core python3 \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libpulse-dev

      - name: Run Memory Safety & Undefined Behavior Suite (ASan + UBSan)
        run: |
          SAN_CC="gcc"
          SAN_CXX="g++"
          if command -v g++-16 >/dev/null 2>&1; then
            SAN_CC="gcc-16"
            SAN_CXX="g++-16"
          elif command -v g++-15 >/dev/null 2>&1; then
            SAN_CC="gcc-15"
            SAN_CXX="g++-15"
          elif command -v clang++-19 >/dev/null 2>&1; then
            SAN_CC="clang-19"
            SAN_CXX="clang++-19"
          elif command -v clang++ >/dev/null 2>&1; then
            SAN_CC="clang"
            SAN_CXX="clang++"
          fi
          CC="$SAN_CC" CXX="$SAN_CXX" ./scripts/run_sanitizers.sh
          rm -rf build_asan

  publish-release:
    needs: [build-test-release, distro-compatibility-matrix, sanitizer-verification]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped') &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Force Update Git Tag 'latest' to Current Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "FPSHUD Latest Portable Release" ${{ github.sha }}
          git push --force origin refs/tags/latest

      - name: Download Portable Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: release_pkg

      - name: Publish Portable Binary to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: "FPSHUD Latest Portable Release (Linux x86_64)"
          body: |
            ### Installation (1-Command Install)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/budicuy/FPS_HUD_FOR_LINUX/main/install.sh | bash
            ```

            ### Uninstallation (Local Uninstall)

            ```bash
            ~/.local/bin/fpshud --uninstall
            ```
          files: |
            release_pkg/fpshud-linux-x86_64.tar.gz
            release_pkg/fpshud-linux-x86_64.tar.gz.sha256
          prerelease: false
