name: CI Build, Test & Release

on:
  push:
    branches: [ "main", "master", "testing" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "testing" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      CC: clang
      CXX: clang++
      AR: llvm-ar
      RANLIB: llvm-ranlib
    steps:
      - name: Install Toolchain & Build Dependencies (Arch Linux)
        run: |
          pacman -Syu --noconfirm --needed \
            clang lld llvm compiler-rt cmake ninja pkgconf git curl python tar xz zlib \
            vulkan-headers vulkan-icd-loader vulkan-swrast vulkan-tools xorg-server-xvfb \
            shaderc glslang libx11 libglvnd mesa libdrm libpulse libva wayland wayland-protocols ffmpeg
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure, Lint, Build & Test (Pure Clang Release + LLD)
        run: |
          cmake --preset release
          cmake --build build --target format-check
          cmake --build build --parallel
          cmake --build build --target clang-tidy
          ctest --test-dir build --output-on-failure

      - name: Package Portable Release & Verify Portability Gates
        run: |
          ./scripts/package_release.sh

      - name: Verify Real Vulkan Hook & HUD Rendering (Mesa Lavapipe CPU Software Rasterizer)
        run: |
          ./scripts/test_vulkan_headless.sh

      - name: Verify End-to-End Installation & Uninstallation Lifecycle
        run: |
          export FPSHUD_RELEASE_URL="file://${PWD}/dist/fpshud-linux-x86_64.tar.gz"
          export FPSHUD_RELEASE_SHA_URL="file://${PWD}/dist/fpshud-linux-x86_64.tar.gz.sha256"
          ./scripts/test_e2e_install.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: |
            dist/fpshud-linux-x86_64.tar.gz
            dist/fpshud-linux-x86_64.tar.gz.sha256

  distro-compatibility-matrix:
    needs: build-test-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: "Arch Linux (Rolling)"
            image: "archlinux:latest"
            cmd: "pacman -Syu --noconfirm --needed tar gzip procps-ng vulkan-icd-loader libpulse libva libdrm binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "Fedora Latest (RPM)"
            image: "fedora:latest"
            cmd: "dnf install -y tar gzip procps-ng vulkan-loader pulseaudio-libs libva libdrm binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "Debian 12 (Bookworm)"
            image: "debian:bookworm-slim"
            cmd: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tar gzip procps libvulkan1 ca-certificates libpulse0 libva2 libva-drm2 libdrm2 binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "Ubuntu 22.04 LTS (Jammy - GLIBC 2.35 Baseline)"
            image: "ubuntu:22.04"
            cmd: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tar gzip procps libvulkan1 ca-certificates libpulse0 libva2 libva-drm2 libdrm2 binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
          - name: "Ubuntu 24.04 LTS (Noble)"
            image: "ubuntu:24.04"
            cmd: "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tar gzip procps libvulkan1 ca-certificates libpulse0 libva2 libva-drm2 libdrm2 binutils && tar -xzf fpshud-linux-x86_64.tar.gz && ./fpshud_test 1"
    steps:
      - name: Download Portable Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: dist_test

      - name: Flatten Artifact Directory
        run: |
          find dist_test -name "fpshud-linux-x86_64.tar.gz*" -exec cp -v {} dist_test/ \;
          ls -la dist_test

      - name: Verify Portable Binary Execution on ${{ matrix.distro.name }}
        run: |
          docker run --rm -v "$PWD/dist_test:/test" -w /test "${{ matrix.distro.image }}" bash -c "${{ matrix.distro.cmd }}"

  sanitizer-verification:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      CC: clang
      CXX: clang++
      AR: llvm-ar
      RANLIB: llvm-ranlib
    steps:
      - name: Install Toolchain & Dependencies for Sanitizers (Arch Linux)
        run: |
          pacman -Syu --noconfirm --needed \
            clang lld llvm compiler-rt cmake ninja pkgconf git curl python tar xz zlib \
            vulkan-headers vulkan-icd-loader vulkan-swrast vulkan-tools xorg-server-xvfb \
            shaderc glslang libx11 libglvnd mesa libdrm libpulse libva wayland wayland-protocols ffmpeg
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Memory Safety, Thread Safety & Undefined Behavior Suite (ASan + UBSan & TSan)
        run: |
          ./scripts/run_sanitizers.sh
          cmake --build build_asan --target clang-tidy
          rm -rf build_asan build_tsan

  publish-release:
    needs: [build-test-release, distro-compatibility-matrix, sanitizer-verification]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped') &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Force Update Git Tag 'latest' to Current Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "FPSHUD Latest Portable Release" ${{ github.sha }}
          git push --force origin refs/tags/latest

      - name: Download Portable Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: fpshud-linux-x86_64
          path: release_pkg

      - name: Ensure Release Files Flat in release_pkg
        run: |
          find release_pkg -name "fpshud-linux-x86_64.tar.gz*" -exec cp -v {} release_pkg/ \;
          ls -la release_pkg

      - name: Publish Portable Binary to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: "FPSHUD Latest Portable Release (Linux x86_64)"
          body: |
            ### Installation (1-Command Install)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/budicuy/FPS_HUD_FOR_LINUX/main/install.sh | bash
            ```

            ### Uninstallation (Local Uninstall)

            ```bash
            ~/.local/bin/fpshud --uninstall
            ```
          files: |
            release_pkg/fpshud-linux-x86_64.tar.gz
            release_pkg/fpshud-linux-x86_64.tar.gz.sha256
          prerelease: false
